
[platformio]
default_envs = skylink-esp32
src_dir = pio_src
data_dir = firmware/esp32_websocket_bridge/data

[env:skylink-esp32]
platform = platformio/espressif32@8.0.0
platform_packages =
    platformio/framework-arduinoespressif32@4.30312.261024
board = esp32dev
framework = arduino
upload_protocol = esptool
upload_port = COM13
monitor_port = COM13
monitor_speed = 9600
board_build.flash_size = 4MB
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.partitions = partitions/no_ota.csv
board_build.filesystem = spiffs
lib_ldf_mode = deep+
extra_scripts = pre:scripts/platformio_framework_includes.py
lib_deps =
    links2004/WebSockets@2.7.2